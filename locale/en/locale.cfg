[mod-setting-description]
hexcoder-fulgoran-drones-inf-scrap=Scrap on vault islands becomes an infinite resource like crude oil.\nStarts out mining faster than normal, but ends up slower once depleted to minimum yield.\nChanging this setting automatically converts the existing vault island scrap on the next load.\nCurrent amounts are kept, and fully mined tiles come back as minimum when switching to infinite.\nOn large maps this can freeze the game for a few seconds on the first load.\nBefore removing the mod, use "Prepare for uninstall" (map settings), otherwise vault islands lose all their scrap.
hexcoder-fulgoran-drones-dead-bot-resource=Dead enemy drones can be mined and recycled for valuable ingredients like batteries and supercapacitors.\nAlso changes player combat robot recipes.
hexcoder-fulgoran-drones-progression-curve=This mods version of evolution\nWave size/frequency/bot quality and quality scrap scale off the depth mined for each vault\nReaching the maximum depth of 100m can take a long time, so by increasing this, the curve pushes most of the progression to happen earlier
hexcoder-fulgoran-drones-max-scrap-quality=Maximum quality tier for scrap around vaults\nany number between 1 to 5\n5=legendary, 1 to disable quality scrap\nonly controls the distribution, quality is a distribution
hexcoder-fulgoran-drones-max-bot-quality=Maximum quality tier for enemy drones\nany number between 1 to 5\n5=legendary, 1 to disable quality drones\nonly controls the distribution, quality is a distribution
hexcoder-fulgoran-drones-wave-max-time=in minutes\nSmall scouting parties will spawn even at vaults with no mining
hexcoder-fulgoran-drones-drills-without-ore=Allows mining drills to be placed near vault ruins\neven without scrap underneath so dead bots can later be harvested.\nThis is a prototype property that has to apply to all mining drills everywhere, so the code has to prevent placement everywhere else.\nBe aware things could go wrong with this setting on.
hexcoder-fulgoran-drones-buff-drones=Buff combat robot HP, resistances and time to live to balance around drones being fought by player turrets, will affect player-thrown combat robots too
hexcoder-fulgoran-drones-nerf-turret-turn=Nerf ammo and laser turret turn rate to make them a bit less effective at destroying drones
hexcoder-fulgoran-drones-uninstall=Undoes this mod's changes to the world so it can be removed safely.\nTo uninstall: turn this on (ingame, not in main menu), save, then remove the mod.\nWithout this, vault islands lose all their infinite scrap and buildings disabled by drones stay disabled until rebuilt as well as the drone force and a hidden surface sticking around.
